name: Ainuoke server source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    # The full SQL/API plus private Chromium job had spent ~17.5 minutes at the P6 failure.
    # Keep every acceptance step and bound the complete job with modest headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compiled server and migration/session source tests
        run: |
          node --test server/integration/chromium-endpoint.test.mjs
          npm run server:build
          npm run test:ainuoke-server-source
          npm run test:order-identity
          npm run test:order-commercial
          npm run test:order-business-source
          npm run test:order-sale-adjustments
          npm run test:processing-batches
          npm run test:processing-quote-push
          npm run test:production-resources
          npm run test:logistics-resources
          npm run test:order-tracking
          npm run test:material-arrivals
          npm run test:garment-shipment-observations
          npm run test:garment-collection-control
          npm run test:garment-target-control
          npm run test:garment-operator
          npm run test:bound-order-refresh
          npx --no-install tsx --test --test-concurrency=1 server/sales-orders/delivery-plan-request.test.ts server/integration/delivery-plan-requests.integration.test.ts
          npx --no-install tsx --test features/order-center/server/__tests__/delivery-plan-client.test.ts features/order-center/server/__tests__/delivery-plan-draft.test.ts features/order-center/server/__tests__/delivery-plan-pending.test.ts
          npm run test:production-planning
          npm run test:production-execution
          npm run test:delivery-coverage
          npm run test:closing-backend
          npm run test:order-usd-labor-adoption
          npx --no-install tsx --test --test-concurrency=1 server/closing/executor-release-model.test.ts server/integration/closing-executor-release.integration.test.ts server/integration/closing-protection-recovery.integration.test.mjs server/integration/persistent-executor-release-recovery.integration.test.mjs
          npx --no-install tsx --test features/production-scheduling/server/__tests__/delivery-coverage-client.test.ts
          npm run test:order-normalization
          npm run test:order-effective-attribution
          npm run test:order-normalization-execution
          npm run test:order-command-control
          npm run test:material-history
          npx --no-install tsx --test --test-concurrency=1 features/style-progress/server/__tests__/material-progress-settings-client.test.ts server/integration/material-progress-settings.integration.test.ts
          npm run test:material-history-client
          npm run test:normalization-review-workspace
          npm run test:normalization-review-client
          npm run test:order-preparation-adoption
          npm run test:order-preparation-client
          npm run test:postgres
          npm run test:ainuoke-continuous
          npm run test:ainuoke-catalog
          npx --no-install tsx --test --test-concurrency=1 server/ainuoke-source/configured-material-reader.test.ts server/ainuoke-source/local-unit-confirmations.test.ts server/integration/ainuoke-automatic-runner.integration.test.ts server/integration/material-archive.integration.test.ts server/integration/historical-material-publication.integration.test.ts server/integration/ainuoke-sync-handoff.integration.test.ts
          npm run test:ainuoke-readiness
          npm run test:ainuoke-readonly-audit
          npm run test:ainuoke-targeted-diagnostic
          npm run test:ainuoke-live-preflight
          npm run test:ainuoke-payment-probe
          npm run test:ainuoke-payment-observations
          npm run test:ainuoke-payment-contracts
          npm run test:ainuoke-payment-snapshots
          npm run test:ainuoke-payment-store
          npm run test:ainuoke-payment-client
          npm run test:ainuoke-payment-collection
          npm run test:ainuoke-payment-operator
          npm run test:ainuoke-selected-source-once
          npx --no-install tsx --test server/integration/fresh-start.integration.test.ts
      - name: Quality, quantity and owned fixture boundaries
        run: |
          node --test scripts/__tests__/quote-trial-config.test.mjs scripts/__tests__/quote-trial-readiness.test.mjs scripts/__tests__/quote-trial-local-objects.test.mjs
          node --test scripts/__tests__/quote-trial-cutover-preview.test.mjs scripts/__tests__/quote-trial-cutover-execute.test.mjs server/integration/persistent-network-fixture.test.mjs
          npx --no-install tsx --test server/integration/ainuoke-quality-diagnostic.test.ts server/integration/ainuoke-quantity-facts.test.ts server/integration/isolated-demo.test.ts
          node --test scripts/__tests__/isolated-source-window.test.mjs scripts/__tests__/isolated-demo-safety.test.mjs scripts/__tests__/isolated-demo-verification.test.mjs
      - name: Explicit source candidate build
        env:
          NEXT_PUBLIC_ZHIXU_QUOTE_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_MASTER_SETTINGS_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_QUOTE_WRITER_MODE: writable
          NEXT_PUBLIC_ZHIXU_IDENTITY_MODE: session
          NEXT_PUBLIC_ZHIXU_ORDER_READ: snapshot
          ZHIXU_GIT_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Existing P6 pages, six roles and persisted refresh in private Chromium
        env:
          GARMENT_SHIPMENTS_EXPECTED_SOURCE: ${{ github.sha }}
          DELIVERY_PLAN_EXPECTED_SOURCE: ${{ github.sha }}
          PAYMENT_PANEL_EXPECTED_SOURCE: ${{ github.sha }}
          CLOSING_UI_EXPECTED_SOURCE: ${{ github.sha }}
          CHROME_PATH: google-chrome
        run: |
          node --test tests/server-navigation-history.test.mjs
          npx --no-install tsx --test server/integration/server-navigation-continuity.integration.test.mjs
          npm run test:production-resources-ui
          npm run test:production-planning-ui
          npm run test:ainuoke-continuous-ui
          npm run test:ainuoke-catalog-ui
          npm run test:processing-batches-ui
          npm run test:processing-quote-push-ui
          npm run test:order-business-source-ui
          npm run test:order-sale-adjustments-ui
          npm run test:material-history-ui
          npx --no-install tsx --test server/integration/material-display-ui.integration.test.mjs
          npm run test:garment-shipments-ui
          npx --no-install tsx --test server/integration/delivery-plan-maintenance-ui.integration.test.mjs
          npm run test:ainuoke-payment-panel-ui
          npx --no-install tsx --test server/integration/closing-adjustment-ui.integration.test.mjs
      - name: Python fixed catalog and transport boundaries
        working-directory: tools/ainuoke-bridge
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s ../../scripts/tests -p test_ainuoke_sync_supervisor.py
