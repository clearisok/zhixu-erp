name: Ainuoke server source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compiled server and migration/session source tests
        run: |
          node --test server/integration/chromium-endpoint.test.mjs
          npm run server:build
          npx --no-install tsx --test --test-concurrency=1 server/production-resources/contract.test.ts server/production-resources/logistics-contract.test.ts server/production-resources/managed-contract.test.ts server/integration/production-resources.integration.test.ts server/integration/logistics-resources.integration.test.ts server/integration/logistics-resources-upgrade.integration.test.ts
          npx --no-install tsx --test --test-concurrency=1 server/production-scheduling/contract.test.ts server/production-scheduling/read-contract.test.ts server/production-scheduling/planning-preview.test.ts server/integration/production-scheduling.integration.test.ts server/integration/production-scheduling-upgrade.integration.test.ts
          npx --no-install tsx --test server/production-scheduling/execution-contract.test.ts server/production-scheduling/execution-preview.test.ts
          npx --no-install tsx --test --test-concurrency=1 server/integration/production-execution.integration.test.ts
          npx --no-install tsx --test --test-concurrency=1 server/production-scheduling/tracking-contract.test.ts server/integration/order-tracking.integration.test.ts server/integration/order-tracking-upgrade.integration.test.ts
          npx --no-install tsx --test features/operations-settings/server/__tests__/*.test.ts
          npx --no-install tsx --test features/production-scheduling/server/__tests__/*.test.ts
          npm run test:ainuoke-server-source
          npm run test:order-source-evidence
          npx --no-install tsx --test --test-concurrency=1 features/quote-center/server/__tests__/quote-creation-contract.test.ts server/integration/quote-order-context.integration.test.ts
          npx --no-install tsx --test features/quote-center/server/__tests__/estimate-workflows.test.ts
          npm run test:order-identity
          npm run test:order-commercial
          npm run test:order-business-source
          npm run test:order-sale-adjustments
          npm run test:processing-batches
          npm run test:processing-quote-push
          npm run test:order-normalization
          npm run test:order-effective-attribution
          npm run test:order-normalization-execution
          npm run test:order-command-control
          npm run test:material-history
          npx --no-install tsx --test --test-concurrency=1 features/style-progress/server/__tests__/material-progress-settings-client.test.ts server/integration/material-progress-settings.integration.test.ts
          npm run test:material-history-client
          npm run test:normalization-review-workspace
          npm run test:normalization-review-client
          npm run test:order-preparation-adoption
          npm run test:order-preparation-client
          npm run test:postgres
          npm run test:ainuoke-continuous
          npm run test:ainuoke-readiness
          npm run test:ainuoke-readonly-audit
          npm run test:ainuoke-targeted-diagnostic
          npm run test:ainuoke-live-preflight
          npm run test:ainuoke-payment-probe
          npx --no-install tsx --test --test-concurrency=1 server/integration/garment-shipment-probe.test.ts
          npm run test:ainuoke-payment-observations
          npm run test:ainuoke-payment-contracts
          npm run test:ainuoke-payment-snapshots
          npm run test:ainuoke-payment-store
          npm run test:ainuoke-payment-client
          npm run test:ainuoke-payment-collection
          npm run test:ainuoke-payment-operator
          npm run test:ainuoke-selected-source-once
          npx --no-install tsx --test server/integration/fresh-start.integration.test.ts
      - name: Quality, quantity and owned fixture boundaries
        run: |
          node --test scripts/__tests__/quote-trial-config.test.mjs scripts/__tests__/quote-trial-readiness.test.mjs scripts/__tests__/quote-trial-local-objects.test.mjs
          npx --no-install tsx --test server/integration/ainuoke-quality-diagnostic.test.ts server/integration/ainuoke-quantity-facts.test.ts server/integration/isolated-demo.test.ts
          node --test scripts/__tests__/isolated-source-window.test.mjs scripts/__tests__/isolated-demo-safety.test.mjs scripts/__tests__/isolated-demo-verification.test.mjs
      - name: Explicit source candidate build
        env:
          NEXT_PUBLIC_ZHIXU_QUOTE_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_MASTER_SETTINGS_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_QUOTE_WRITER_MODE: writable
          NEXT_PUBLIC_ZHIXU_IDENTITY_MODE: session
          NEXT_PUBLIC_ZHIXU_ORDER_READ: snapshot
          ZHIXU_GIT_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Existing P6 pages, six roles and persisted refresh in private Chromium
        run: |
          node --test tests/server-navigation-history.test.mjs
          npx --no-install tsx --test server/integration/server-navigation-continuity.integration.test.mjs
          npm run test:ainuoke-continuous-ui
          npx --no-install tsx --test server/integration/order-saved-sources-ui.integration.test.mjs
          npx --no-install tsx --test server/integration/quote-order-context-ui.integration.test.mjs
          npx --no-install tsx --test server/integration/production-resources-ui.integration.test.mjs
          npx --no-install tsx --test server/integration/production-scheduling-ui.integration.test.mjs
          npm run test:processing-batches-ui
          npm run test:processing-quote-push-ui
          npm run test:order-business-source-ui
          npm run test:order-sale-adjustments-ui
          npm run test:material-history-ui
          npx --no-install tsx --test server/integration/material-display-ui.integration.test.mjs
          npm run test:ainuoke-payment-panel-ui
      - name: Quote lifecycle, workbooks, summaries and defaults in private Chromium
        run: npm run test:quote-server-ui
      - name: Python fixed catalog and transport boundaries
        working-directory: tools/ainuoke-bridge
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests
