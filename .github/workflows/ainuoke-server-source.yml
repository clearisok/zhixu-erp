name: Ainuoke server source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compiled server and migration/session source tests
        run: |
          npm run server:build
          npm run test:ainuoke-server-source
          npx --no-install tsx --test server/integration/fresh-start.integration.test.ts
      - name: Python fixed catalog and transport boundaries
        working-directory: tools/ainuoke-bridge
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests
