name: Release baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Guard negative cases and current responsive behavior
        run: |
          node --test scripts/__tests__/resolve-pr-validation-base.test.mjs
          npm run test:release-baseline
      - name: Delivery evidence and bounded recovery against isolated Git fixtures
        run: node --test scripts/__tests__/git-delivery-state.test.mjs scripts/__tests__/git-delivery.test.mjs
      - name: Guard syntax and lint
        run: |
          node --check scripts/check-release-baseline.mjs
          node --check scripts/resolve-pr-validation-base.mjs
          npx --no-install eslint scripts/check-release-baseline.mjs tests/release-baseline-guard.test.mjs scripts/resolve-pr-validation-base.mjs scripts/__tests__/resolve-pr-validation-base.test.mjs --max-warnings 0
      - name: Validate reviewed baseline and UI impact
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(node scripts/resolve-pr-validation-base.mjs)"
            npm run check:release-baseline -- --base-sha "$BASE_SHA"
          elif [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ]; then
            npm run check:release-baseline
          else
            exit 1
          fi
