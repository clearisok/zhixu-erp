name: Release baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Guard negative cases and current responsive behavior
        run: npm run test:release-baseline
      - name: Guard syntax and lint
        run: |
          node --check scripts/check-release-baseline.mjs
          npx --no-install eslint scripts/check-release-baseline.mjs tests/release-baseline-guard.test.mjs --max-warnings 0
      - name: Validate reviewed baseline and UI impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            npm run check:release-baseline -- --base-sha "$BASE_SHA"
          else
            npm run check:release-baseline
          fi
