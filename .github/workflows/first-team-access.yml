name: First team access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types, lint and source regression
        run: |
          npm run typecheck
          npm run server:build
          npm run lint
          npm test
      - name: Disposable PostgreSQL role, session and commercial boundaries
        run: |
          npm run test:team-access
          npm run test:business-operation-logs
          npx --no-install tsx --test --test-concurrency=1 server/integration/browser-session-e2e.integration.test.ts server/integration/commercial-rbac.integration.test.ts server/integration/quote-cost-security.integration.test.ts
      - name: Default Browser build
        run: npm run build
      - name: Explicit Server session build
        env:
          NEXT_PUBLIC_ZHIXU_QUOTE_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_MASTER_SETTINGS_AUTHORITY: server
          NEXT_PUBLIC_ZHIXU_QUOTE_WRITER_MODE: writable
          NEXT_PUBLIC_ZHIXU_IDENTITY_MODE: session
          NEXT_PUBLIC_ZHIXU_ORDER_READ: snapshot
        run: npm run build
      - name: Existing UI with synthetic accounts in Chromium
        run: |
          npm run test:team-access-ui
          npm run test:server-auth-frontend
          npm run test:animated-login-ui
