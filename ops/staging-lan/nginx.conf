# Site-specific first-client configuration. No public catch-all, DB or Docker mounts.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    server {
        listen 192.168.66.69:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 192.168.66.69:443 ssl;
        server_name staging.weaveops.top;
        ssl_certificate /run/lan/tls/current/fullchain.pem;
        ssl_certificate_key /run/lan/tls/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:LAN:10m;
        ssl_session_timeout 1h;
        # Clear cached Cloudflare HTTP/3 alternatives after the first LAN response.
        add_header Alt-Svc clear always;
        add_header X-WeaveOps-Ingress staging-lan always;
        if ($host != staging.weaveops.top) { return 444; }
        # First-client acceptance only; office-wide expansion needs explicit review.
        allow 192.168.83.51;
        allow 192.168.66.69;
        deny all;
        client_max_body_size 100m;
        client_body_timeout 120s;
        location / {
            proxy_pass https://127.0.0.1:3003;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name localhost;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/lan/origin-ca.pem;
            proxy_ssl_verify_depth 2;
            proxy_set_header Host staging.weaveops.top;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host staging.weaveops.top;
            # Overwrite untrusted client forwarding/Cloudflare identity headers.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded '';
            proxy_set_header CF-Connecting-IP '';
            proxy_set_header CF-Access-Jwt-Assertion '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
