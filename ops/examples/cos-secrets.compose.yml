# INERT EXAMPLE ONLY. Never compose-up this fragment alone.
# Merge manually into a separately reviewed deployment; no port/mode/DB changes here.
services:
  server-foundation:
    environment:
      ZHIXU_ATTACHMENT_STORAGE: s3
      ZHIXU_ATTACHMENT_S3_ENDPOINT: https://cos.ap-hongkong.myqcloud.com
      ZHIXU_ATTACHMENT_S3_REGION: ap-hongkong
      ZHIXU_ATTACHMENT_S3_BUCKET: weaveops-prod-1501437430
      ZHIXU_ATTACHMENT_S3_FORCE_PATH_STYLE: "false"
      ZHIXU_ATTACHMENT_S3_ACCESS_KEY_ID_FILE: /run/secrets/zhixu_cos_secret_id
      ZHIXU_ATTACHMENT_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/zhixu_cos_secret_key
    secrets:
      - zhixu_cos_secret_id
      - zhixu_cos_secret_key
secrets:
  zhixu_cos_secret_id:
    file: /etc/zhixu/secrets/cos/secret-id
  zhixu_cos_secret_key:
    file: /etc/zhixu/secrets/cos/secret-key
# file-source secrets use bind mounts: YAML uid/gid/mode is NOT a permissions proof.
# Verify actual numeric runtime UID/GID, owner/mode 0600 and read-only mount before deployment.
